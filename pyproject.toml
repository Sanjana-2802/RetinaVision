[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retinacare-ai"
version = "2.0.0"
description = "AI-Based Eye Disease Identification and Health Recommendation System (Batch 33)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Batch 33 Team (23551A42B3, 23551A4275, 24555A4207)" }
]
keywords = [
    "fastapi",
    "deep-learning",
    "pytorch",
    "gradcam",
    "xai",
    "ophthalmology",
    "retinal-fundus",
    "threejs",
    "healthcare-ai"
]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "fastapi-cli>=0.0.5",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "reportlab>=4.0.0",
    "sqlalchemy>=2.0.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.9.0",
    "aiofiles>=24.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
retinacare = "app.main:app"

[tool.fastapi]
app = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/requirements.txt",
    "/README.md",
    "/run.py"
]
