[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eye-retina-ai"
version = "2.0.0"
description = "Automated Multi-Lesion Segmentation, Disease Severity Grading, and Retinal Abnormality Detection in Fundus Images Using Deep Learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

keywords = [
    "fastapi",
    "deep-learning",
    "pytorch",
    "gradcam",
    "xai",
    "ophthalmology",
    "retinal-fundus",
    "unet",
    "convnext",
    "ghostnet",
    "medical-segmentation"
]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "fastapi-cli>=0.0.5",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "pillow>=10.4.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "reportlab>=4.0.0",
    "sqlalchemy>=2.0.0",
    "matplotlib>=3.8.0",
    "pydantic>=2.9.0",
    "aiofiles>=24.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
eye-retina = "app.main:app"

[tool.fastapi]
entrypoint = "app.main:app"
app = "app.main:app"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
]

